[s3-deep-archive]
type                  = s3
provider              = AWS

 env_auth            = true


region                = eu-west-1

# ── Storage class ─────────────────────────────────────────────────────────────
# This sets the DEFAULT class for uploads via this remote.
# The backup.sh script also passes --s3-storage-class explicitly,
# so this acts as a fallback / reminder of intent.
#
#   DEEP_ARCHIVE      $0.00099/GB/mo   180-day min   restore within 12h
#   GLACIER           $0.0036/GB/mo    90-day min    1 min–12h retrieval
#   GLACIER_IR        $0.004/GB/mo     90-day min    instant retrieval
#   STANDARD_IA       $0.0125/GB/mo    30-day min    instant retrieval
#   STANDARD          $0.023/GB/mo first 50 TB; $0.022 next 450 TB;
#                     $0.021/GB/mo over 500 TB
#   INTELLIGENT_TIERING $0.023/GB/mo frequent; $0.0125 infrequent;
#                     $0.004 archive instant; $0.0036 archive;
#                     $0.00099 deep archive + $0.0025/1,000 objects/mo
#                     monitoring for objects over 128 KB
#   EXPRESS_ONEZONE   $0.11/GB/mo    ONEZONE_IA $0.01/GB/mo

storage_class         = DEEP_ARCHIVE

chunk_size            = 128M
upload_concurrency    = 4
disable_checksum      = false

