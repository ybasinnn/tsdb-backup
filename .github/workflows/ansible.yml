name: Ansible

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible:
    name: Syntax check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: pip install "ansible-core>=2.17,<2.21" "ansible-lint>=25,<27"

      # backup_user uses authorized_key, which lives in the ansible.posix collection.
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check
        run: ansible-playbook -i localhost, monitoring_backup.yaml --syntax-check

      - name: ansible-lint
        run: ansible-lint monitoring_backup.yaml backup_monitoring_data backup_user
